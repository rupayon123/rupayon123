<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Battle stats</title>
  <desc id="desc">A pixel game style stats card showing repositories, TypeScript, hardware, automation, and boss mode.</desc>
  <rect width="1200" height="300" fill="#101820"/>
  <rect x="28" y="28" width="1144" height="244" fill="#1b1f23" stroke="#ffffff" stroke-width="6" shape-rendering="crispEdges"/>
  <rect x="44" y="44" width="1112" height="212" fill="none" stroke="#ffcb05" stroke-width="4" shape-rendering="crispEdges"/>
  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="900">
    <text x="76" y="88" fill="#ffcb05" font-size="30">BATTLE STATS</text>
    <text x="76" y="122" fill="#ffffff" font-size="16">public quests, maker labs, and student tools</text>
  </g>
  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="800" font-size="18" shape-rendering="crispEdges">
    <text x="90" y="168" fill="#ffffff">PUBLIC QUESTS</text>
    <rect x="330" y="146" width="500" height="28" fill="#2d333b"/>
    <rect x="330" y="146" width="270" height="28" fill="#ffcb05"/>
    <text x="850" y="168" fill="#ffcb05">5 FOUND</text>

    <text x="90" y="208" fill="#ffffff">TYPESCRIPT</text>
    <rect x="330" y="186" width="500" height="28" fill="#2d333b"/>
    <rect x="330" y="186" width="390" height="28" fill="#3178c6"/>
    <text x="850" y="208" fill="#58a6ff">MAIN MOVE</text>

    <text x="90" y="248" fill="#ffffff">HARDWARE LABS</text>
    <rect x="330" y="226" width="500" height="28" fill="#2d333b"/>
    <rect x="330" y="226" width="310" height="28" fill="#00979d"/>
    <text x="850" y="248" fill="#7ee787">ARDUINO READY</text>
  </g>
  <g shape-rendering="crispEdges">
    <rect x="980" y="74" width="24" height="24" fill="#ffcb05"/>
    <rect x="1004" y="50" width="96" height="24" fill="#e3350d"/>
    <rect x="1028" y="26" width="48" height="24" fill="#ffcb05"/>
    <rect x="1004" y="98" width="96" height="72" fill="#2a75bb"/>
    <rect x="980" y="122" width="24" height="24" fill="#ffcb05"/>
    <rect x="1100" y="122" width="24" height="24" fill="#ffcb05"/>
    <rect x="1028" y="170" width="24" height="48" fill="#ffffff"/>
    <rect x="1076" y="170" width="24" height="48" fill="#ffffff"/>
    <rect x="1028" y="74" width="16" height="16" fill="#ffffff"/>
    <rect x="1068" y="74" width="16" height="16" fill="#ffffff"/>
    <rect x="1034" y="80" width="6" height="6" fill="#1b1f23"/>
    <rect x="1074" y="80" width="6" height="6" fill="#1b1f23"/>
  </g>
</svg>
