<svg xmlns="http://www.w3.org/2000/svg" width="580" height="360" viewBox="0 0 580 360" role="img" aria-labelledby="title desc">
  <title id="title">Blue Pokédex profile data panel</title>
  <desc id="desc">A clean blue Pokédex data panel listing Rupayon Haldar's profile details.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e8fbff"/>
      <stop offset="1" stop-color="#9ee8ff"/>
    </linearGradient>
  </defs>

  <rect width="580" height="360" fill="#111827"/>
  <rect y="0" width="580" height="42" fill="#555b77"/>
  <text x="290" y="30" fill="#ffffff" font-family="Monaco, Consolas, 'Courier New', monospace" font-size="24" font-weight="900" text-anchor="middle">DATA</text>

  <g shape-rendering="crispEdges">
    <rect x="18" y="60" width="544" height="292" fill="#303b58"/>
    <rect x="30" y="72" width="520" height="268" fill="url(#screen)" stroke="#26324d" stroke-width="6"/>
    <rect x="44" y="88" width="184" height="42" fill="#3d4668"/>
    <rect x="242" y="88" width="292" height="42" fill="#f0fcff" stroke="#6ccff6" stroke-width="4"/>
    <rect x="44" y="146" width="490" height="40" fill="#f0fcff" stroke="#7ad9f7" stroke-width="2"/>
    <rect x="44" y="192" width="490" height="40" fill="#f0fcff" stroke="#7ad9f7" stroke-width="2"/>
    <rect x="44" y="238" width="490" height="40" fill="#f0fcff" stroke="#7ad9f7" stroke-width="2"/>
    <rect x="44" y="284" width="490" height="40" fill="#f0fcff" stroke="#7ad9f7" stroke-width="2"/>
  </g>

  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="900">
    <text x="72" y="116" fill="#ffffff" font-size="21">ENTRY</text>
    <text x="264" y="116" fill="#26324d" font-size="20">Rupayon Haldar</text>

    <text x="64" y="172" fill="#26324d" font-size="18">ROLE</text>
    <text x="188" y="172" fill="#0b61b2" font-size="18">Full-stack developer</text>

    <text x="64" y="218" fill="#26324d" font-size="18">BUILDS</text>
    <text x="188" y="218" fill="#0b61b2" font-size="18">student tools, dashboards</text>

    <text x="64" y="264" fill="#26324d" font-size="18">STACK</text>
    <text x="188" y="264" fill="#0b61b2" font-size="18">React, TS, Node, Python</text>

    <text x="64" y="310" fill="#26324d" font-size="18">SIDE</text>
    <text x="188" y="310" fill="#0b61b2" font-size="18">Arduino + hardware labs</text>
  </g>
</svg>
