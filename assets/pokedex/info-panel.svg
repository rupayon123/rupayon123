<svg xmlns="http://www.w3.org/2000/svg" width="580" height="390" viewBox="0 0 580 390" role="img" aria-labelledby="title desc">
  <title id="title">Blue Pokédex profile data panel</title>
  <desc id="desc">A clean blue Pokédex data panel listing Rupayon Haldar's profile details.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#dffaff"/>
      <stop offset="1" stop-color="#9ee8ff"/>
    </linearGradient>
  </defs>

  <rect width="580" height="390" fill="#202638"/>
  <rect y="0" width="580" height="44" fill="#545a75"/>
  <text x="290" y="31" fill="#ffffff" font-family="Monaco, Consolas, 'Courier New', monospace" font-size="24" font-weight="900" text-anchor="middle">DATA</text>

  <g shape-rendering="crispEdges">
    <rect x="18" y="62" width="544" height="310" fill="#33415f"/>
    <rect x="30" y="74" width="520" height="286" fill="url(#screen)" stroke="#283650" stroke-width="6"/>
    <rect x="42" y="88" width="184" height="44" fill="#3c4669"/>
    <rect x="238" y="88" width="296" height="44" fill="#edfaff" stroke="#66cdf4" stroke-width="4"/>
    <rect x="42" y="148" width="492" height="290" fill="none"/>
  </g>

  <g opacity="0.16" stroke="#247abc" stroke-width="3">
    <path d="M30 148H550M30 196H550M30 244H550M30 292H550M30 340H550"/>
    <path d="M154 74V360M290 74V360M426 74V360"/>
  </g>

  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="900">
    <text x="72" y="117" fill="#ffffff" font-size="21">ENTRY</text>
    <text x="260" y="117" fill="#2d3748" font-size="21">Rupayon Haldar</text>

    <text x="52" y="172" fill="#2d3748" font-size="18">ROLE</text>
    <text x="186" y="172" fill="#0b61b2" font-size="18">Full-stack developer</text>

    <text x="52" y="218" fill="#2d3748" font-size="18">BUILDS</text>
    <text x="186" y="218" fill="#0b61b2" font-size="18">student tools, dashboards</text>

    <text x="52" y="264" fill="#2d3748" font-size="18">STACK</text>
    <text x="186" y="264" fill="#0b61b2" font-size="18">React, TS, Node, Python</text>

    <text x="52" y="310" fill="#2d3748" font-size="18">SIDE</text>
    <text x="186" y="310" fill="#0b61b2" font-size="18">Arduino + hardware labs</text>

    <text x="52" y="346" fill="#2d3748" font-size="18">STYLE</text>
    <text x="186" y="346" fill="#0b61b2" font-size="18">clean, practical, useful</text>
  </g>
</svg>
