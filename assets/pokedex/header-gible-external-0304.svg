<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Rupayon's Pokedex profile header</title>
  <desc id="desc">A clean blue Pokedex-style GitHub profile header with Gible beside Rupayon's profile stats.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e2fbff"/>
      <stop offset="1" stop-color="#8ee2ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="270" fill="#111827"/>
  <rect y="0" width="1200" height="50" fill="#555b77"/>
  <g shape-rendering="crispEdges">
    <rect y="50" width="1200" height="6" fill="#8fe9ff"/>
    <rect y="56" width="1200" height="5" fill="#2f8cff"/>
    <rect x="34" y="78" width="1128" height="184" fill="#303b58"/>
    <rect x="48" y="92" width="1100" height="156" fill="url(#screen)" stroke="#26324d" stroke-width="8"/>
  </g>

  <text x="600" y="36" fill="#ffffff" font-family="Monaco, Consolas, 'Courier New', monospace" font-size="30" font-weight="900" text-anchor="middle">Rupayon's Pokedex</text>

  <g shape-rendering="crispEdges">
    <rect x="76" y="112" width="440" height="54" fill="#f0fcff" stroke="#3d4668" stroke-width="5"/>
    <rect x="76" y="180" width="440" height="54" fill="#f0fcff" stroke="#3d4668" stroke-width="5"/>
    <rect x="536" y="112" width="392" height="54" fill="#f0fcff" stroke="#3d4668" stroke-width="5"/>
    <rect x="536" y="180" width="392" height="54" fill="#f0fcff" stroke="#3d4668" stroke-width="5"/>
    <rect x="954" y="106" width="118" height="132" fill="#f0fcff" stroke="#3d4668" stroke-width="6"/>
  </g>

  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="900">
    <text x="106" y="145" fill="#26324d" font-size="19">FRONT END</text>
    <text x="244" y="145" fill="#0b61b2" font-size="20">React + TS</text>

    <text x="106" y="213" fill="#26324d" font-size="19">BACK END</text>
    <text x="244" y="213" fill="#0b61b2" font-size="20">Node + Python</text>

    <text x="566" y="145" fill="#26324d" font-size="19">BUILDS</text>
    <text x="688" y="145" fill="#0b61b2" font-size="20">ML + student tools</text>

    <text x="566" y="213" fill="#26324d" font-size="19">WEAKNESS</text>
    <text x="688" y="213" fill="#0b61b2" font-size="20">Cynthia</text>

    <text x="1013" y="128" fill="#26324d" font-size="17" text-anchor="middle">No.0304</text>
  </g>

  <image href="../pokemon/gible.gif" x="972" y="138" width="84" height="80" preserveAspectRatio="xMidYMid meet"/>
</svg>
