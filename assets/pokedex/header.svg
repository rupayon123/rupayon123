<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Rupayon Haldar Pokédex profile header</title>
  <desc id="desc">A clean blue Pokédex-style GitHub profile header.</desc>
  <defs>
