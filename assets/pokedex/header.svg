<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Rupayon Haldar Pokédex profile header</title>
  <desc id="desc">A clean blue Pokédex-style GitHub profile header with readable text.</desc>
  <defs>
    <linearGradient id="screen" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#e2fbff"/>
      <stop offset="1" stop-color="#8ee2ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#111827"/>
  <rect y="0" width="1200" height="50" fill="#555b77"/>
  <g shape-rendering="crispEdges">
    <rect y="50" width="1200" height="6" fill="#8fe9ff"/>
    <rect y="56" width="1200" height="5" fill="#2f8cff"/>
    <rect x="34" y="78" width="1128" height="174" fill="#303b58"/>
    <rect x="48" y="92" width="1100" height="146" fill="url(#screen)" stroke="#26324d" stroke-width="8"/>
  </g>

  <text x="600" y="36" fill="#ffffff" font-family="Monaco, Consolas, 'Courier New', monospace" font-size="30" font-weight="900" text-anchor="middle">Rupayon Pokédex</text>

  <g shape-rendering="crispEdges">
    <rect x="82" y="116" width="452" height="58" fill="#3d4668"/>
    <rect x="96" y="128" width="424" height="34" fill="#f0fcff" stroke="#6ccff6" stroke-width="4"/>
    <rect x="82" y="188" width="452" height="42" fill="#f0fcff" stroke="#3d4668" stroke-width="5"/>

    <rect x="590" y="116" width="426" height="58" fill="#3d4668"/>
    <rect x="604" y="128" width="398" height="34" fill="#f0fcff" stroke="#6ccff6" stroke-width="4"/>
    <rect x="590" y="188" width="426" height="42" fill="#f0fcff" stroke="#3d4668" stroke-width="5"/>

    <rect x="1040" y="116" width="96" height="114" fill="#f8fcff" stroke="#3d4668" stroke-width="6"/>
    <rect x="1062" y="140" width="42" height="10" fill="#2f8cff"/>
    <rect x="1062" y="164" width="56" height="10" fill="#46d9f0"/>
    <rect x="1062" y="188" width="36" height="10" fill="#1f6fff"/>
  </g>

  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="900">
    <text x="116" y="154" fill="#26324d" font-size="27">Rupayon Haldar</text>
    <text x="624" y="154" fill="#26324d" font-size="25">Full-stack Dev</text>
    <text x="116" y="216" fill="#26324d" font-size="21">React / TS / Python</text>
    <text x="624" y="216" fill="#0b61b2" font-size="21">Student tools + hardware</text>
  </g>
</svg>
