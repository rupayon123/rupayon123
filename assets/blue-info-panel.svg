<svg xmlns="http://www.w3.org/2000/svg" width="560" height="360" viewBox="0 0 560 360" role="img" aria-labelledby="title desc">
  <title id="title">Profile information panel</title>
  <desc id="desc">A simple futuristic interface panel listing Rupayon's profile information.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07101f"/>
      <stop offset="1" stop-color="#0c2442"/>
    </linearGradient>
  </defs>
  <rect width="560" height="360" fill="#050914"/>
  <rect x="18" y="18" width="524" height="324" fill="url(#panel)" stroke="#46e6ff" stroke-width="2"/>
  <g opacity="0.18" stroke="#46e6ff" stroke-width="1">
    <path d="M18 72H542M18 126H542M18 180H542M18 234H542M18 288H542"/>
    <path d="M70 18V342M122 18V342M174 18V342M226 18V342M278 18V342M330 18V342M382 18V342M434 18V342M486 18V342"/>
  </g>
  <g font-family="Monaco, Consolas, 'Courier New', monospace" font-weight="800">
