    <text x="44" y="214" fill="#46e6ff" font-size="14">FOCUS</text>
    <text x="154" y="214" fill="#d7fbff" font-size="16">Student tools and hardware</text>

    <text x="44" y="258" fill="#46e6ff" font-size="14">STACK</text>
